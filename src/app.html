<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TCG도감 · 포켓몬 카드 도감과 시세</title>
<meta name="description" content="모든 포켓몬 TCG 확장팩과 프로모 카드, 등급별 리스트와 예상 시세, 홀로 3D 카드 뷰어">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://api.tcgdex.net">
<link rel="preconnect" href="https://assets.tcgdex.net">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
<style>
/* Layout: sticky glass top bar, asymmetric hero (copy left, live holo card right), series-grouped set grid, rarity-grouped card grid, side-panel modal.
   Shape rule: TCG cards use the real card radius (4.5%), panels 20px, every interactive control is a full pill. */
:root{
  --bg:#EDEFF3; --surface:#F8F9FB; --surface-2:#E3E6EC; --ink:#12141A; --muted:#5B6170; --faint:#8A90A0;
  --line:rgba(18,20,30,.09); --accent:#E0362A; --accent-soft:rgba(224,54,42,.1); --on-accent:#FFF7F5;
  --good:#1F8A5B; --shadow:rgba(30,36,60,.14); --scrim:rgba(14,16,22,.55); --glass:rgba(248,249,251,.72);
  --font-display:"Geist","Pretendard Variable","Pretendard",system-ui,sans-serif;
  --font-body:"Pretendard Variable","Pretendard","Geist",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --font-mono:"Geist Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
  --ease-out:cubic-bezier(.16,1,.3,1); --ease-spring:cubic-bezier(.34,1.56,.64,1);
  --r-panel:20px; --gutter:clamp(16px,4vw,40px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0C0E12; --surface:#15181E; --surface-2:#1E222A; --ink:#ECEEF2; --muted:#9AA0AE; --faint:#6B7180;
  --line:rgba(236,238,242,.08); --accent:#FF5446; --accent-soft:rgba(255,84,70,.14); --on-accent:#1A0705;
  --good:#3DCB8A; --shadow:rgba(0,0,0,.5); --scrim:rgba(4,5,8,.72); --glass:rgba(21,24,30,.7); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C0E12; --surface:#15181E; --surface-2:#1E222A; --ink:#ECEEF2; --muted:#9AA0AE; --faint:#6B7180;
  --line:rgba(236,238,242,.08); --accent:#FF5446; --accent-soft:rgba(255,84,70,.14); --on-accent:#1A0705;
  --good:#3DCB8A; --shadow:rgba(0,0,0,.5); --scrim:rgba(4,5,8,.72); --glass:rgba(21,24,30,.7); color-scheme:dark}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.55;
  -webkit-font-smoothing:antialiased;min-height:100dvh;overflow-x:hidden}
img{max-width:100%;display:block}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input{font:inherit;color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:999px}
.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.wrap{max-width:1360px;margin-inline:auto;padding-inline:var(--gutter)}

/* ---------- Top bar ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--glass);
  backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);border-bottom:1px solid var(--line)}
.topbar .wrap{display:flex;align-items:center;gap:12px;height:64px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:700;font-size:18px;letter-spacing:-.03em;text-decoration:none;color:inherit;flex-shrink:0}
.brand-mark{width:26px;height:26px;border-radius:50%;position:relative;overflow:hidden;
  background:linear-gradient(var(--accent) 0 46%,var(--ink) 46% 54%,var(--surface) 54%);box-shadow:inset 0 0 0 2px var(--ink);transition:transform .6s var(--ease-spring)}
.brand-mark::after{content:"";position:absolute;inset:50% auto auto 50%;width:9px;height:9px;transform:translate(-50%,-50%);border-radius:50%;background:var(--surface);box-shadow:0 0 0 2px var(--ink)}
.brand:hover .brand-mark{transform:rotate(-200deg)}
.nav{display:flex;gap:4px;margin-left:8px;padding:4px;background:var(--surface-2);border-radius:999px;position:relative}
.nav a{position:relative;z-index:1;display:flex;align-items:center;gap:6px;padding:7px 14px;border-radius:999px;font-weight:600;font-size:14px;color:var(--muted);text-decoration:none;transition:color .25s}
.nav a[aria-current="page"]{color:var(--ink)}
.nav-pill{position:absolute;top:4px;bottom:4px;left:0;border-radius:999px;background:var(--surface);box-shadow:0 1px 3px var(--shadow);transition:transform .45s var(--ease-out),width .45s var(--ease-out)}
.badge{min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--accent);color:var(--on-accent);font-size:11px;font-weight:700;display:inline-grid;place-items:center;font-family:var(--font-mono)}
.badge.bump{animation:bump .5s var(--ease-spring)}
@keyframes bump{40%{transform:scale(1.35)}}
.top-actions{margin-left:auto;display:flex;gap:6px;align-items:center}
.icon-btn{width:38px;height:38px;border-radius:999px;display:grid;place-items:center;font-size:18px;color:var(--muted);transition:background .2s,color .2s,transform .15s}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
.icon-btn:active{transform:scale(.92)}
.seg{display:flex;padding:3px;background:var(--surface-2);border-radius:999px;font-size:13px;font-weight:600}
.seg button{padding:6px 11px;border-radius:999px;color:var(--muted);transition:background .25s,color .25s}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px var(--shadow)}

/* ---------- Hero ---------- */
.hero{display:grid;grid-template-columns:minmax(0,.92fr) minmax(0,1.08fr);gap:clamp(24px,5vw,72px);align-items:center;padding-block:clamp(28px,5vw,64px) clamp(20px,3vw,40px)}
.hero h1{font-family:var(--font-display);font-size:clamp(34px,5.2vw,64px);line-height:1.04;letter-spacing:-.045em;font-weight:800;margin:0 0 18px;text-wrap:balance}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero p.lead{color:var(--muted);font-size:clamp(15px,1.4vw,17px);max-width:46ch;margin:0 0 28px}
.search{position:relative;max-width:520px}
.search i{position:absolute;left:18px;top:50%;transform:translateY(-50%);font-size:19px;color:var(--faint);pointer-events:none}
.search input{width:100%;height:54px;border-radius:999px;border:1px solid var(--line);background:var(--surface);padding:0 120px 0 48px;font-size:15px;
  box-shadow:0 1px 2px var(--shadow);transition:border-color .2s,box-shadow .3s}
.search input::placeholder{color:var(--faint)}
.search input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.search .go{position:absolute;right:6px;top:6px;height:42px;padding:0 18px;border-radius:999px;background:var(--ink);color:var(--bg);font-weight:600;font-size:14px;transition:transform .15s}
.search .go:active{transform:scale(.96)}
.stats{display:flex;gap:clamp(20px,4vw,44px);margin-top:32px}
.stat b{display:block;font-family:var(--font-mono);font-size:clamp(22px,2.4vw,30px);font-weight:600;letter-spacing:-.04em}
.stat span{font-size:13px;color:var(--muted)}
/* Card rack: a receding 3D row of top cards. Hover lifts a card with a falloff wave on its neighbours,
   wheel / drag / arrows slide the row, click opens the holo viewer. Positions come from JS springs. */
.rack{position:relative;height:clamp(420px,42vw,580px);--cw:clamp(150px,15.5vw,226px);touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:grab;outline:none;border-radius:var(--r-panel)}
/* No box: the stage only clips, with a soft fade where the row runs off to the right. */
.rk-stage{position:absolute;inset:0;overflow:hidden;perspective:1100px;perspective-origin:85% 0%;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 3%,#000 78%,transparent);mask-image:linear-gradient(90deg,transparent,#000 3%,#000 78%,transparent)}
.rack.dragging{cursor:grabbing}
.rack:focus-visible{box-shadow:0 0 0 2px var(--accent)}
.rk-track{position:absolute;left:clamp(8px,3%,40px);bottom:clamp(64px,13%,84px);width:var(--cw);aspect-ratio:63/88;transform-style:preserve-3d}
.rk-card{position:absolute;inset:0;border-radius:4.6%/3.3%;transform-origin:50% 100%;will-change:transform,opacity;
  background:var(--surface-2);box-shadow:0 24px 40px -18px var(--shadow),0 2px 6px var(--shadow);cursor:inherit;-webkit-tap-highlight-color:transparent}
.rk-card img{width:100%;height:100%;object-fit:cover;border-radius:inherit;pointer-events:none}
.rk-card::after{content:"";position:absolute;inset:0;border-radius:inherit;background:var(--bg);opacity:var(--sh,0);pointer-events:none}
.rk-glare{position:absolute;inset:0;border-radius:inherit;pointer-events:none;mix-blend-mode:overlay;opacity:var(--l,0);
  background:linear-gradient(112deg,transparent calc(var(--gx,50%) - 28%),rgba(255,255,255,.75) var(--gx,50%),transparent calc(var(--gx,50%) + 28%))}
.rk-card:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
.rk-card.skel{box-shadow:none}
.rk-info{position:absolute;left:0;top:clamp(4px,2%,16px);right:0;pointer-events:none;z-index:2}
.rk-rank{font-family:var(--font-mono);font-size:12px;color:var(--muted);letter-spacing:.02em}
.rk-rank b{color:var(--accent);font-weight:600}
.rk-name{font-family:var(--font-display);font-size:clamp(20px,2.1vw,28px);font-weight:800;letter-spacing:-.035em;line-height:1.15;margin-top:4px}
.rk-sub{font-size:13px;color:var(--muted);margin-top:2px}
.rk-price{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:14px}
.rk-price b{font-family:var(--font-mono);font-weight:600;font-size:16px;letter-spacing:-.02em}
.rk-price .err{color:var(--muted);font-family:var(--font-mono);font-size:12px}
.rk-code{padding:2px 8px;border-radius:999px;background:var(--ink);color:var(--bg);font-size:11px;font-weight:700;font-family:var(--font-mono)}
.rk-info.swap>*{animation:rkIn .5s var(--ease-out) both}
.rk-info.swap>:nth-child(2){animation-delay:.03s}.rk-info.swap>:nth-child(3){animation-delay:.06s}.rk-info.swap>:nth-child(4){animation-delay:.09s}.rk-info.swap>:nth-child(5){animation-delay:.12s}
@keyframes rkIn{from{opacity:0;transform:translateY(10px);filter:blur(4px)}}
.rk-foot{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;gap:12px;z-index:2}
.rk-ticks{display:flex;gap:4px;flex:1;min-width:0}
.rk-ticks button{flex:1;max-width:22px;height:18px;position:relative}
.rk-ticks button::before{content:"";position:absolute;left:0;right:0;top:50%;height:3px;margin-top:-1.5px;border-radius:2px;background:var(--line);transition:background .3s,transform .4s var(--ease-spring)}
.rk-ticks button:hover::before{background:var(--faint)}
.rk-ticks button[aria-current="true"]::before{background:var(--accent);transform:scaleY(1.7)}
.rk-hint{font-size:12px;color:var(--faint);white-space:nowrap}
.rk-nav{display:flex;gap:6px}
.rk-nav button{width:36px;height:36px;border-radius:999px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);font-size:16px;transition:transform .15s,background .2s,opacity .2s}
.rk-nav button:hover{background:var(--bg)}
.rk-nav button:active{transform:scale(.92)}
.rk-nav button:disabled{opacity:.35;cursor:default}

/* ---------- Toolbar / chips ---------- */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding-block:8px 18px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;scroll-snap-type:x proximity;padding-block:2px;min-width:0;flex:1}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;scroll-snap-align:start;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap;transition:background .2s,color .2s,border-color .2s,transform .15s}
.chip:hover{color:var(--ink);border-color:color-mix(in srgb,var(--ink) 20%,transparent)}
.chip:active{transform:scale(.95)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .cnt{font-family:var(--font-mono);font-weight:500;opacity:.6;margin-left:4px}

/* ---------- Series + set grid ---------- */
.series{padding-block:18px}
.series-head{display:flex;align-items:baseline;gap:12px;margin-bottom:14px}
.series-head h2{font-family:var(--font-display);font-size:22px;letter-spacing:-.03em;margin:0;font-weight:700}
.series-head span{color:var(--faint);font-size:13px}
.set-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.set-tile{position:relative;display:flex;flex-direction:column;gap:12px;padding:16px;border-radius:var(--r-panel);background:var(--surface);border:1px solid var(--line);
  text-decoration:none;color:inherit;overflow:hidden;isolation:isolate;
  transition:transform .4s var(--ease-out),box-shadow .4s var(--ease-out),border-color .3s;animation:rise .6s var(--ease-out) backwards;animation-delay:calc(min(var(--i,0),18) * 28ms)}
.set-tile::before{content:"";position:absolute;inset:0;z-index:-1;opacity:0;transition:opacity .3s;
  background:radial-gradient(260px circle at var(--px,50%) var(--py,50%),var(--accent-soft),transparent 60%)}
.set-tile:hover{transform:translateY(-4px);box-shadow:0 18px 40px -18px var(--shadow);border-color:color-mix(in srgb,var(--accent) 30%,transparent)}
.set-tile:hover::before{opacity:1}
.set-tile:active{transform:translateY(-1px) scale(.99)}
.set-logo{height:72px;display:grid;place-items:center}
.set-logo img{max-height:72px;max-width:88%;object-fit:contain;filter:drop-shadow(0 4px 10px var(--shadow));transition:transform .5s var(--ease-spring)}
.set-tile:hover .set-logo img{transform:scale(1.07) rotate(-1.5deg)}
.set-logo .fallback{font-family:var(--font-display);font-weight:800;font-size:19px;letter-spacing:-.03em;text-align:center;line-height:1.1;text-wrap:balance}
.set-meta{display:flex;justify-content:space-between;align-items:flex-end;gap:8px;border-top:1px solid var(--line);padding-top:10px}
.set-meta .name{font-weight:600;font-size:14px;line-height:1.3;min-width:0}
.set-meta .sub{font-size:12px;color:var(--faint)}
.set-meta .count{font-family:var(--font-mono);font-size:12px;color:var(--muted);white-space:nowrap}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);margin-left:6px;vertical-align:1px}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}

/* ---------- Set header ---------- */
.back{display:inline-flex;align-items:center;gap:6px;padding:8px 14px 8px 10px;margin-top:20px;border-radius:999px;font-weight:600;font-size:14px;color:var(--muted);transition:background .2s,color .2s}
.back:hover{background:var(--surface-2);color:var(--ink)}
.back i{transition:transform .3s var(--ease-out)}
.back:hover i{transform:translateX(-3px)}
.set-hero{display:grid;grid-template-columns:auto minmax(0,1fr);gap:clamp(18px,4vw,48px);align-items:center;padding-block:20px 8px}
.set-hero .logo-box{width:clamp(140px,22vw,240px);height:clamp(90px,12vw,130px);display:grid;place-items:center}
.set-hero .logo-box img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 8px 20px var(--shadow))}
.set-hero h1{font-family:var(--font-display);font-size:clamp(28px,4vw,46px);letter-spacing:-.04em;line-height:1.05;margin:0 0 8px;font-weight:800;text-wrap:balance}
.set-hero .facts{display:flex;flex-wrap:wrap;gap:6px 18px;color:var(--muted);font-size:14px}
.set-hero .facts b{color:var(--ink);font-weight:600}
.summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-block:20px}
.sum{padding:16px 18px;border-radius:var(--r-panel);background:var(--surface);border:1px solid var(--line);min-width:0}
.sum small{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.sum b{font-family:var(--font-mono);font-size:clamp(18px,2vw,24px);font-weight:600;letter-spacing:-.03em;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sum .err{font-family:var(--font-mono);font-size:12px;color:var(--faint)}
.sum.top{display:flex;gap:12px;align-items:center;cursor:pointer;text-align:left;width:100%;transition:transform .3s var(--ease-out),border-color .3s}
.sum.top:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--accent) 35%,transparent)}
.sum.top img{width:44px;border-radius:3px;flex-shrink:0;box-shadow:0 4px 12px var(--shadow)}
.sum.top div{min-width:0}
.sum.top .nm{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding-block:6px 4px}
.mini-search{position:relative;flex:0 1 260px}
.mini-search i{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--faint)}
.mini-search input{width:100%;height:38px;border-radius:999px;border:1px solid var(--line);background:var(--surface);padding:0 14px 0 36px;font-size:14px}
.mini-search input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}

/* ---------- Progress ---------- */
.progress{margin-block:18px;padding:18px;border-radius:var(--r-panel);background:var(--surface);border:1px solid var(--line)}
.progress p{margin:0 0 10px;font-size:14px;color:var(--muted)}
.progress .bar{height:6px;border-radius:999px;overflow:hidden;background:var(--surface-2)}
.progress .bar i{display:block;height:100%;width:0;border-radius:inherit;background:linear-gradient(90deg,var(--accent),#ffb03a,#41d1a0,#4aa8ff,#b56bff);background-size:300% 100%;animation:flow 3s linear infinite;transition:width .3s var(--ease-out)}
@keyframes flow{to{background-position:300% 0}}

/* ---------- Rarity group + card grid ---------- */
.rgroup{padding-block:14px}
.rhead{position:sticky;top:calc(env(safe-area-inset-top,0px) + 64px);z-index:5;display:flex;align-items:center;gap:10px;padding:12px 0;background:linear-gradient(var(--bg) 70%,transparent)}
.rhead h3{margin:0;font-family:var(--font-display);font-size:17px;letter-spacing:-.02em;font-weight:700}
.rhead .en{font-size:12px;color:var(--faint)}
.rhead .cnt{font-family:var(--font-mono);font-size:12px;color:var(--muted);margin-left:auto}
.gem{width:14px;height:14px;border-radius:4px;transform:rotate(45deg);flex-shrink:0;background:var(--gem,var(--faint))}
.gem[data-t="1"]{--gem:linear-gradient(135deg,#9ad0ff,#c9a6ff)}
.gem[data-t="2"]{--gem:linear-gradient(135deg,#ff8a8a,#ffd36b,#7dffc4)}
.gem[data-t="3"]{--gem:conic-gradient(#ff6b6b,#ffd93d,#6bffb8,#6bc5ff,#c56bff,#ff6b6b);box-shadow:0 0 12px #ffd36b88}
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:22px 16px}
.tile{position:relative;display:flex;flex-direction:column;gap:10px;min-width:0;animation:rise .55s var(--ease-out) backwards;animation-delay:calc(min(var(--i,0),24) * 22ms)}
.tile .face{position:relative;aspect-ratio:63/88;border-radius:4.6%/3.3%;background:var(--surface-2);overflow:hidden;cursor:pointer;
  transform:perspective(700px) rotateY(var(--ty,0deg)) rotateX(var(--tx,0deg));transition:transform .5s var(--ease-out),box-shadow .5s var(--ease-out);box-shadow:0 2px 6px var(--shadow)}
.tile .face:hover{box-shadow:0 22px 40px -16px var(--shadow)}
.tile .face img{width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .5s}
.tile .face img.ok{opacity:1}
.tile .face::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .3s;mix-blend-mode:overlay;
  background:radial-gradient(circle at var(--gx,50%) var(--gy,50%),rgba(255,255,255,.75),transparent 55%)}
.tile .face:hover::after{opacity:1}
.tile[data-t="2"] .face::after,.tile[data-t="3"] .face::after{mix-blend-mode:color-dodge;
  background:radial-gradient(circle at var(--gx,50%) var(--gy,50%),rgba(255,255,255,.55),transparent 45%),

<script>
"use strict";
const API = "https://api.tcgdex.net/v2/en";
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
const HOUR = 3600e3;

/* ================= storage ================= */
const ls = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
const idb = (() => {
  let dbp = null;
  const mem = new Map();
  function open() {
    if (dbp) return dbp;
    dbp = new Promise(res => {
      try {
        const r = indexedDB.open("foildex", 1);
        r.onupgradeneeded = () => r.result.createObjectStore("kv");
        r.onsuccess = () => res(r.result);
        r.onerror = () => res(null);
      } catch { res(null); }
    });
    return dbp;
  }
  return {
    async get(k) {
      if (mem.has(k)) return mem.get(k);
      const db = await open(); if (!db) return undefined;
      return new Promise(res => {
        try { const q = db.transaction("kv").objectStore("kv").get(k); q.onsuccess = () => { if (q.result) mem.set(k, q.result); res(q.result); }; q.onerror = () => res(undefined); }
        catch { res(undefined); }
      });
    },
    async set(k, v) {
      mem.set(k, v);
      const db = await open(); if (!db) return;
      try { db.transaction("kv", "readwrite").objectStore("kv").put(v, k); } catch {}
    }
  };
})();

async function fetchJSON(url, tries = 3) {
  let err;
  for (let i = 0; i < tries; i++) {
    const ctl = new AbortController();
    const to = setTimeout(() => ctl.abort(), 20000);
    try {
      const r = await fetch(url, { signal: ctl.signal });
      clearTimeout(to);
      if (r.status === 404) return null;
      if (!r.ok) throw new Error("HTTP " + r.status);
      return await r.json();
    } catch (e) { clearTimeout(to); err = e; await new Promise(r => setTimeout(r, 400 * (i + 1))); }
  }
  throw err;
}
async function cached(key, ttl, fetcher) {
  const hit = await idb.get(key);
  if (hit && Date.now() - hit.t < ttl) return hit.v;
  try {
    const v = await fetcher();
    if (v != null) idb.set(key, { t: Date.now(), v });
    return v;
  } catch (e) { if (hit) return hit.v; throw e; }
}
async function pool(items, n, fn, onEach) {
  let i = 0, done = 0;
  const out = new Array(items.length);
  async function worker() {
    while (i < items.length) {
      const idx = i++;
      try { out[idx] = await fn(items[idx], idx); } catch { out[idx] = null; }
      done++; onEach && onEach(done, items.length, idx, out[idx]);
    }
  }
  await Promise.all(Array.from({ length: Math.min(n, items.length) }, worker));
  return out;
}

let CATALOG = null;
async function loadCatalog() {
  if (CATALOG) return CATALOG;
  const series = await cached("series", 24 * HOUR, () => fetchJSON(`${API}/series`));
  const list = series.filter(s => !EXCLUDED_SERIES.has(s.id));
  const details = await pool(list, 8, s => cached("serie:" + s.id, 24 * HOUR, () => fetchJSON(`${API}/series/${s.id}`)));
  const out = [];
  details.forEach((d, i) => {
    if (!d || !d.sets || !d.sets.length) return;
    out.push({ id: d.id, name: d.name, ko: SERIES_KO[d.id] || d.name, date: d.releaseDate || "1990-01-01",
      sets: d.sets.map(s => ({ ...s, serie: d.id, kind: setKind(s, d.id) })) });
  });
  // Newest series first; side collections (McDonald's, trainer kits, misc) go last.
  const side = id => ["mc", "tk", "misc"].includes(id) ? 1 : 0;
  out.sort((a, b) => side(a.id) - side(b.id) || (b.date || "").localeCompare(a.date || ""));
  // Within a series the API order is release order, so newest first means reversed.
  out.forEach(s => s.sets.reverse());
  CATALOG = out;
  return out;
}
function setKind(s, serie) {
  const n = (s.name || "").toLowerCase();
  if (n.includes("promo") || /p$/.test(s.id) && !/^(sv|swsh|sm|xy|bw|dp|pl|hgss|ex|me)\d/.test(s.id)) return "promo";
  if (serie === "misc" || serie === "tk" || serie === "mc" || n.includes("energ") || n.includes("trainer kit") || n.includes("mcdonald") || n.includes("trick or trade") || n.includes("deck")) return "other";
  return "main";
}
function findSet(id) {
  for (const s of CATALOG || []) for (const x of s.sets) if (x.id === id) return { ...x, serieName: s.name, serieKo: s.ko };
  return null;
}

function rarity(card) {
  const r = card && card.rarity || "None";
  const d = RAR[r] || [5, r, "", 1];
  let tier = d[3];
  // Older "Rare" cards printed only as holo get the holo treatment.
  if (tier === 0 && card && card.variants && card.variants.holo && !card.variants.normal) tier = 1;
  return { key: r, rank: d[0], ko: d[1], code: d[2], tier };
}

/* ================= korean names ================= */
const KO_PREFIX = { "Mega ":"메가 ", "Radiant ":"찬란한 ", "Alolan ":"알로라 ", "Galarian ":"가라르 ", "Hisuian ":"히스이 ", "Paldean ":"팔데아 ", "Dark ":"다크 ", "Light ":"라이트 ", "Shining ":"빛나는 ", "Team Rocket's ":"로켓단의 " };
const SUFFIX_RE = /\s?(ex|EX|GX|-GX|V|VMAX|VSTAR|V-UNION|BREAK|LV\.X|Prime|☆|δ|◇|LEGEND)$/;
function koName(card) {
  if (!card || !card.dexId || !card.dexId.length || typeof KO_NAMES === "undefined") return "";
  const base = card.dexId.map(n => KO_NAMES[n - 1]).filter(Boolean).join(" & ");
  if (!base) return "";
  let pre = "";
  for (const k in KO_PREFIX) if (card.name.startsWith(k)) { pre = KO_PREFIX[k]; break; }
  const m = card.name.match(SUFFIX_RE);
  return pre + base + (m ? " " + m[1].replace(/^-/, "") : "");
}
function koToEn(q) {
  if (typeof KO_NAMES === "undefined" || !/[가-힣]/.test(q)) return null;
  const t = q.trim();
  let i = KO_NAMES.indexOf(t);
  if (i < 0) i = KO_NAMES.findIndex(n => n.startsWith(t));
  if (i < 0) i = KO_NAMES.findIndex(n => n.includes(t));
  return i >= 0 ? EN_NAMES[i] : null;
}

let FX = ls.get("fx", null) || FX_FALLBACK;
let CUR = ls.get("cur", "KRW");
async function loadFx() {

function fxLine() {
  return `1 USD = ₩${Math.round(FX.KRW).toLocaleString("ko-KR")}, 1 EUR = ₩${Math.round(FX.KRW / FX.EUR).toLocaleString("ko-KR")} (${FX.date})`;
}
function money(usd, cur = CUR) {
  if (usd == null || !isFinite(usd)) return "-";
  const v = usd * FX[cur];
  if (cur === "KRW") {
    const r = v >= 10000 ? Math.round(v / 100) * 100 : v >= 1000 ? Math.round(v / 10) * 10 : Math.max(10, Math.round(v / 10) * 10);
    return "₩" + r.toLocaleString("ko-KR");
  }
  const sym = cur === "USD" ? "$" : "€";
  return sym + (v >= 100 ? Math.round(v).toLocaleString("en-US") : v.toFixed(2));
}
const median = a => { const s = [...a].sort((x, y) => x - y), m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };
/* Estimate: median of every recent signal (Cardmarket trend / 1·7·30-day averages / overall average, TCGPlayer market & mid),
   all converted to USD. The ± error is half the spread of those signals relative to the median, with a floor that grows for
   cheap cards (where listing noise dominates) and a 75% ceiling. */
function estimate(card) {
  const p = card && card.pricing;
  if (!p) return null;
  const vals = [], src = {};
  const cm = p.cardmarket;
  if (cm) {
    const keys = ["trend", "avg1", "avg7", "avg30", "avg"];
    let arr = keys.map(k => cm[k]).filter(v => v > 0);
    let suffix = "";
    if (!arr.length) { arr = keys.map(k => cm[k + "-holo"]).filter(v => v > 0); suffix = "-holo"; }
    const eurToUsd = 1 / FX.EUR;
    arr.forEach(v => vals.push(v * eurToUsd));
    src.cm = { trend: cm["trend" + suffix], avg7: cm["avg7" + suffix], avg30: cm["avg30" + suffix], low: cm["low" + suffix], updated: cm.updated };
  }
  const tp = p.tcgplayer;
  if (tp && typeof tp === "object") {
    for (const k in tp) {
      const v = tp[k];
      if (v && typeof v === "object" && (v.marketPrice || v.midPrice)) {
        if (v.marketPrice > 0) { vals.push(v.marketPrice, v.marketPrice); }
        if (v.midPrice > 0) vals.push(v.midPrice);
        src.tp = { variant: k, market: v.marketPrice, low: v.lowPrice, high: v.highPrice, updated: tp.updated };
        break;
      }
    }
  }
  if (!vals.length) return null;
  const c = median(vals);
  const spread = (Math.max(...vals) - Math.min(...vals)) / 2 / c;
  const floor = c < 1 ? .3 : c < 5 ? .2 : c < 30 ? .12 : .08;
  const err = Math.min(.75, Math.max(floor, spread));
  return { usd: c, err, lo: c * (1 - err), hi: c * (1 + err), src, n: vals.length };
}
/* Graded estimates. There is no free, keyless feed of graded sales, so these scale the raw NM estimate by
   era multipliers (older cards rarely grade gem mint, so their premium is far larger) with a per-grade floor
   that roughly covers the grading fee. The error combines the raw error with a wide model error. */
const GRADES = [["PSA", "9"], ["PSA", "10"], ["BRG", "10"], ["BGS", "9.5"], ["BGS", "10"], ["BGS", "프리스틴 10"], ["BGS", "블랙라벨"], ["CGC", "10"], ["CGC", "프리스틴 10"], ["TAG", "10"]];
const GRADE_MULT = {
  modern: [1.0, 2.2, 1.3, 1.5, 2.4, 3.0, 6, 1.5, 2.4, 1.6],
  mid: [1.4, 3.5, 1.6, 2.2, 4, 5, 12, 2.2, 3.5, 2.3],
  older: [2, 6, 2.5, 3.5, 7, 9, 25, 3.5, 6, 3.5],
  vintage: [3, 15, 3.6, 6, 18, 22, 60, 6, 12, 6]
};
const GRADE_FLOOR = [12, 25, 15, 20, 35, 45, 120, 18, 30, 18];
const ERA_ERR = { modern: .4, mid: .5, older: .6, vintage: .7 };
const ERA_KO = { modern: "소드&실드 이후", mid: "BW~썬&문", older: "EX~하트골드", vintage: "WotC 시절(1999~2003)" };
function cardEra(card) {
  const id = (card && card.set && card.set.id || "").toLowerCase();
  const s = findSet(card && card.set && card.set.id), serie = s ? s.serie : "";
  const key = ["mc", "tk", "misc", ""].includes(serie) ? id : serie;
  if (/^(base|gym|neo|lc|ecard|si|wp|bog)/.test(key)) return "vintage";
  if (/^(ex|pop|dp|pl|hgss|hs|col|np|ru)/.test(key)) return "older";
  if (/^(bw|xy|sm|g1|dc|det|dv)/.test(key)) return "mid";
  return "modern";
}
function gradeEstimates(card, est) {
  const era = cardEra(card);
  if (!est) return { era, err: null, rows: GRADES.map(g => ({ co: g[0], name: g[1], usd: null })) };
  const m = GRADE_MULT[era], damp = est.usd > 500 ? .85 : 1;
  const err = Math.min(.9, Math.hypot(est.err, ERA_ERR[era]));
  return { era, err, rows: GRADES.map((g, k) => ({ co: g[0], name: g[1], usd: Math.max(GRADE_FLOOR[k], est.usd * (1 + (m[k] - 1) * damp)) })) };
}
function gradeHTML(card, est) {
  const g = gradeEstimates(card, est);
  return `<div class="gbox">
    <div class="gbox-head"><small>등급 카드 시세 (추정)</small>${g.err != null ? `<span>±${Math.round(g.err * 100)}%</span>` : ""}</div>
    <div class="glist">${g.rows.map((r, k) => `<div class="grow${r.name === "10" && r.co === "PSA" ? " hot" : ""}" style="--i:${k}"><span class="gco">${r.co}</span><span class="gn">${esc(r.name)}</span>${r.usd != null ? `<b>${money(r.usd)}</b>` : `<b class="none">---</b>`}</div>`).join("")}</div>
    <p class="note">${est ? `실제 등급 카드 거래가가 아니라 일반 시세에 ${ERA_KO[g.era]} 카드의 등급별 배율을 곱한 추정치예요. 등급 카드는 개체마다 차이가 커서 실거래가와 크게 다를 수 있어요.` : `일반 시세가 없어 등급 시세도 추정할 수 없어요.`}</p>
  </div>`;
}
function priceHTML(est) {
  if (!est) return `<span class="price na">시세 없음</span>`;
  return `<span class="price">${money(est.usd)}<small>±${Math.round(est.err * 100)}%</small></span>`;
}

let FAVS = ls.get("favs", {});

function toggleFav(card, btn) {
  const id = card.id;

      usd: est && est.usd, err: est && est.err, added: Date.now() };

function burst(el) {
  if (reduceMotion) return;
  const r = el.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  const colors = ["#ff5446", "#ffb03a", "#41d1a0", "#4aa8ff", "#b56bff", "#ff7ac3"];
  for (let i = 0; i < 12; i++) {
    const s = document.createElement("i");
    s.className = "spark";
    const a = (i / 12) * Math.PI * 2 + Math.random() * .4, d = 26 + Math.random() * 24;
    s.style.cssText = `left:${cx - 3}px;top:${cy - 3}px;background:${colors[i % colors.length]};--dx:${Math.cos(a) * d}px;--dy:${Math.sin(a) * d}px`;
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 750);
  }
}

/* ================= toast ================= */
let toastTimer;
function toast(msg, actionLabel, action) {
  const old = $(".toast"); if (old) old.remove();
  clearTimeout(toastTimer);
  const t = document.createElement("div");
  t.className = "toast"; t.setAttribute("role", "status");
  t.innerHTML = `<span>${esc(msg)}</span>${actionLabel ? `<button>${esc(actionLabel)}</button>` : ""}`;
  if (actionLabel) t.querySelector("button").onclick = () => { action(); t.remove(); };
  if (!actionLabel) t.style.paddingRight = "18px";
  document.body.appendChild(t);
  toastTimer = setTimeout(() => { t.classList.add("out"); setTimeout(() => t.remove(), 260); }, 2600);
}

/* ================= holo card (spring physics) ================= */
const GLITTER = (() => {
  try {
    const c = document.createElement("canvas"); c.width = c.height = 220;
    const g = c.getContext("2d");
    g.fillStyle = "#000"; g.fillRect(0, 0, 220, 220);
    for (let i = 0; i < 900; i++) {
      const x = Math.random() * 220, y = Math.random() * 220, r = Math.random() < .08 ? 1.6 : Math.random() * .9 + .3;
      g.fillStyle = `hsla(${Math.random() * 360},90%,${70 + Math.random() * 30}%,${.5 + Math.random() * .5})`;
      g.beginPath(); g.arc(x, y, r, 0, 7); g.fill();
    }
    for (let i = 0; i < 40; i++) {
      const x = Math.random() * 220, y = Math.random() * 220, l = 2 + Math.random() * 4;
      g.strokeStyle = "rgba(255,255,255,.9)"; g.lineWidth = .7;
      g.beginPath(); g.moveTo(x - l, y); g.lineTo(x + l, y); g.moveTo(x, y - l); g.lineTo(x, y + l); g.stroke();
    }
    return `url(${c.toDataURL("image/png")})`;
  } catch { return "none"; }
})();
document.documentElement.style.setProperty("--glitter-tex", GLITTER);

function spring(v, stiffness = .07, damping = .26) { return { v, t: v, vel: 0, k: stiffness, d: damping }; }
function step(s) { const f = (s.t - s.v) * s.k; s.vel = (s.vel + f) * (1 - s.d); s.v += s.vel; return Math.abs(s.vel) > .0005 || Math.abs(s.t - s.v) > .001; }

function makeHolo(card, { intro = false, idle = true } = {}) {
  const r = rarity(card);
  const el = document.createElement("div");
  el.className = "holo" + (intro && !reduceMotion ? " intro" : "");
  el.dataset.t = r.tier;
  el.setAttribute("role", "img");
  el.setAttribute("aria-label", `${card.name} 카드 이미지. 마우스나 손가락으로 기울여 볼 수 있어요`);
  el.innerHTML = `<div class="rot">
      <img class="art" src="${esc(img(card.image, "high"))}" alt="" draggable="false" crossorigin="anonymous" referrerpolicy="no-referrer">
      <div class="layer shine"></div><div class="layer glitter"></div><div class="layer glare"></div><div class="layer edge"></div>
    </div>`;
  const art = el.querySelector("img.art");
  art.onerror = () => { art.onerror = null; art.removeAttribute("crossorigin"); art.src = img(card.image, "low"); };

  const S = { rx: spring(0), ry: spring(0), mx: spring(50), my: spring(50), o: spring(0, .05, .3), s: spring(1, .06, .3) };
  let raf = 0, interacting = false, lastInput = 0, alive = true;
  const set = () => {
    const st = el.style;
    st.setProperty("--rx", S.rx.v.toFixed(2) + "deg");
    st.setProperty("--ry", S.ry.v.toFixed(2) + "deg");
    st.setProperty("--mx", S.mx.v.toFixed(2) + "%");
    st.setProperty("--my", S.my.v.toFixed(2) + "%");
    st.setProperty("--bx", (50 + (S.mx.v - 50) * .5).toFixed(2) + "%");
    st.setProperty("--by", (50 + (S.my.v - 50) * .5).toFixed(2) + "%");
    st.setProperty("--o", S.o.v.toFixed(3));
    st.setProperty("--s", S.s.v.toFixed(4));
    st.setProperty("--hyp", Math.min(1, Math.hypot(S.mx.v - 50, S.my.v - 50) / 50).toFixed(3));
  };
  const loop = (now) => {
    if (!alive || !el.isConnected) { alive = false; return; }
    if (idle && !interacting && !reduceMotion && now - lastInput > 1600) {
      // Idle sway: a slow figure-eight so the foil keeps catching light.
      const t = now / 1000;
      aim(50 + Math.sin(t * .9) * 32, 50 + Math.sin(t * 1.3) * 26, .55, false);
    }
    let moving = false;
    for (const k in S) moving = step(S[k]) || moving;
    set();
    raf = requestAnimationFrame(loop);
  };
  function aim(px, py, o = 1, user = true) {
    px = Math.max(0, Math.min(100, px)); py = Math.max(0, Math.min(100, py));
    S.mx.t = px; S.my.t = py;
    S.rx.t = (px - 50) / 3.2;   // rotateY follows horizontal position
    S.ry.t = -(py - 50) / 3.6;  // rotateX follows vertical position
    S.o.t = o;

function drawSetBody() {

const numSort = (a, b) => (parseInt(a.localId, 10) || 0) - (parseInt(b.localId, 10) || 0) || String(a.localId).localeCompare(String(b.localId));
function drawCards() {
  const out = $("#cardsOut"); if (!out) return;
  const q = setState.q.trim().toLowerCase();
  let cards = CURRENT.cards.filter(c => (setState.rar === "all" || c._r.key === setState.rar) &&

  if (!cards.length) { out.innerHTML = `<div class="empty"><i class="ph ph-cards"></i><h2>조건에 맞는 카드가 없어요</h2><p>검색어나 등급 필터를 바꿔 보세요.</p></div>`; return; }

    cards.slice().sort((a, b) => b._r.rank - a._r.rank || numSort(a, b)).forEach(c => { if (!groups.has(c._r.key)) groups.set(c._r.key, []); groups.get(c._r.key).push(c); });

      <div class="sum"><small>가장 비싼 카드</small><b>${priced.length ? money(Math.max(...priced.map(f => f.usd))) : "-"}</b><span class="err">${esc((priced.sort((a, b) => b.usd - a.usd)[0] || {}).name || "")}</span></div>

    </div>

    <div class="card-grid" style="margin-top:18px" id="favGrid">${sorted.map((f, i) => `
      <article class="tile" data-t="${f.tier || 0}" style="--i:${i}">
        <div class="face" data-open="${esc(f.id)}" role="button" tabindex="0" aria-label="${esc(f.name)} 자세히 보기">${f.image ? `<img data-src="${esc(img(f.image))}" alt="" loading="lazy">` : `<div class="ph-placeholder">${esc(f.name)}</div>`}</div>

async function openCard(id, origin) {

  document.body.appendChild(m);
  document.body.style.overflow = "hidden";

  history.pushState({ modal: true }, "");

  let card = (CURRENT.cards || []).find(x => x.id === id);

  const r = rarity(card), est = estimate(card), ko = koName(card);
  if (FAVS[card.id] && est) { FAVS[card.id].usd = est.usd; FAVS[card.id].err = est.err; ls.set("favs", FAVS); }

  stage.innerHTML = "";
  stage.appendChild(holo);
  stage.insertAdjacentHTML("beforeend", `<div class="hint"><i class="ph ph-hand-pointing"></i>카드 위에서 움직이거나 끌어서 기울여 보세요</div>`);
  if (typeof DeviceOrientationEvent !== "undefined" && matchMedia("(pointer: coarse)").matches) setupGyro(stage, holo);
  const off = card.set && card.set.cardCount && card.set.cardCount.official;
  const range = est ? rangeHTML(est) : "";
  m.querySelector(".detail").innerHTML = `
    <div class="set-line"><a href="#/set/${encodeURIComponent(card.set.id)}" style="color:inherit;font-weight:600">${esc(card.set.name)}</a><span class="num">${esc(card.localId)}${off ? "/" + off : ""}</span></div>
    <h2>${esc(card.name)}</h2>
    ${ko ? `<div class="ko-name">${esc(ko)}</div>` : ""}
    <div class="rpill"><span class="gem" data-t="${r.tier}"></span>${esc(r.ko)}${r.code ? ` · ${esc(r.code)}` : ""}<span style="color:var(--faint);font-weight:400">${esc(r.key)}</span></div>
    <div class="pbox">
      <small>예상 시세 (${CUR === "KRW" ? "원화 환산" : CUR})</small>
      ${est ? `<div class="big"><b>${money(est.usd)}</b><span>±${Math.round(est.err * 100)}%</span></div>${range}
        <div class="sources">
          ${est.src.cm ? `<div><span>Cardmarket 추세가</span><b>${eur(est.src.cm.trend)}</b></div><div><span>최근 30일 평균</span><b>${eur(est.src.cm.avg30)}</b></div><div><span>최근 7일 평균</span><b>${eur(est.src.cm.avg7)}</b></div><div><span>최저 매물</span><b>${eur(est.src.cm.low)}</b></div>` : ""}
          ${est.src.tp ? `<div><span>TCGPlayer 마켓</span><b>${usd(est.src.tp.market)}</b></div><div><span>TCGPlayer 범위</span><b>${usd(est.src.tp.low)}~${usd(est.src.tp.high)}</b></div>` : ""}
        </div>
        <p class="note">시세 신호 ${est.n}개의 중앙값이며, 신호 간 편차로 오차율을 계산했어요. 미국·유럽 거래 기준(미등급, NM)이라 국내 시세와 다를 수 있어요.${est.src.cm && est.src.cm.updated ? ` 갱신 ${esc(est.src.cm.updated.slice(0, 10))}.` : ""}</p>`
      : `<div class="big"><b style="font-size:22px;color:var(--muted)">시세 정보 없음</b></div><p class="note">이 카드는 아직 거래 데이터가 없어요. 오래된 프로모나 비매품일 수 있어요.</p>`}
    </div>
    ${gradeHTML(card, est)}
    <div class="facts-grid">
      <div><small>일러스트</small><b>${esc(card.illustrator || "-")}</b></div>
      <div><small>종류</small><b>${esc(catKo(card))}</b></div>
      <div><small>레귤레이션</small><b>${esc(card.regulationMark || "-")}</b></div>
    </div>
    <div class="actions">
      <button class="btn" data-fav="${esc(card.id)}" aria-pressed="${isFav(card.id)}"><i class="${isFav(card.id) ? "ph-fill" : "ph"} ph-heart"></i><span class="t">${isFav(card.id) ? "즐겨찾기됨" : "즐겨찾기"}</span></button>
      <a class="btn ghost" target="_blank" rel="noopener" href="https://www.tcgplayer.com/search/pokemon/product?q=${encodeURIComponent(card.name + " " + card.set.name)}"><i class="ph ph-arrow-square-out"></i>TCGPlayer</a>
      <a class="btn ghost" target="_blank" rel="noopener" href="https://www.cardmarket.com/en/Pokemon/Products/Search?searchString=${encodeURIComponent(card.name)}"><i class="ph ph-arrow-square-out"></i>Cardmarket</a>
    </div>`;
}
const eur = v => v > 0 ? "€" + (v >= 100 ? Math.round(v) : v.toFixed(2)) : "-";
const usd = v => v > 0 ? "$" + (v >= 100 ? Math.round(v) : v.toFixed(2)) : "-";
function catKo(c) { return { Pokemon: "포켓몬", Trainer: "트레이너스", Energy: "에너지" }[c.category] || c.category || "-"; }
function rangeHTML(est) {
  // Axis runs a little past both ends of the estimate band so the band reads as a range.
  const min = est.lo * .75, max = est.hi * 1.12, pct = v => ((v - min) / (max - min) * 100).toFixed(2) + "%";
  return `<div class="range" aria-hidden="true"><div class="band" style="left:${pct(est.lo)};width:calc(${pct(est.hi)} - ${pct(est.lo)})"></div><div class="mk" style="left:${pct(est.usd)}"></div></div>
    <div class="range-labels"><span>최저 ${money(est.lo)}</span><span>최고 ${money(est.hi)}</span></div>`;
}
function setupGyro(stage, holo) {
  const start = () => {
    window.addEventListener("deviceorientation", gyroHandler, { passive: true });
    modal && (modal.gyro = true);
  };
  if (typeof DeviceOrientationEvent.requestPermission === "function") {
    const b = document.createElement("button");
    b.className = "btn ghost tilt-btn"; b.innerHTML = `<i class="ph ph-device-mobile-speaker"></i>폰을 기울여서 보기`;
    b.onclick = async () => { try { if (await DeviceOrientationEvent.requestPermission() === "granted") { start(); b.remove(); } } catch { b.remove(); } };
    stage.appendChild(b);
  } else start();
}
function gyroHandler(e) { if (modal && modal.holo && e.beta != null) modal.holo.tiltFromGyro(e.beta, e.gamma); }
function closeModal(silent) {
  if (!modal) return;
  const { el, holo, lastFocus } = modal;
  modal = null;
  window.removeEventListener("deviceorientation", gyroHandler);
  document.body.style.overflow = "";
  if (!silent && history.state && history.state.modal) history.back();
  el.classList.add("closing");
  setTimeout(() => { holo && holo.destroy(); el.remove(); }, reduceMotion ? 0 : 280);
  if (lastFocus && lastFocus.focus) lastFocus.focus({ preventScroll: true });
}
window.addEventListener("popstate", () => { if (modal) closeModal(true); });

/* ================= theme + currency ================= */
const THEMES = ["system", "light", "dark"];
let theme = ls.get("theme", "system");
function applyTheme() {
  if (theme === "system") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", theme);
  const icon = { system: "ph-circle-half", light: "ph-sun", dark: "ph-moon" }[theme];
  $("#themeBtn").innerHTML = `<i class="ph ${icon}"></i>`;
  $("#themeBtn").setAttribute("aria-label", `테마: ${{ system: "시스템", light: "라이트", dark: "다크" }[theme]}. 눌러서 바꾸기`);
}
$("#themeBtn").onclick = () => {
  theme = THEMES[(THEMES.indexOf(theme) + 1) % 3]; ls.set("theme", theme);
  const go = () => applyTheme();
  document.startViewTransition && !reduceMotion ? document.startViewTransition(go) : go();
};
$$("[data-cur]").forEach(b => b.onclick = () => {
  CUR = b.dataset.cur; ls.set("cur", CUR);
  $$("[data-cur]").forEach(x => x.setAttribute("aria-pressed", x === b));
  if (route.name === "set" && CURRENT.cards.length && $("#cardsOut")) drawSetBody();
  else if (route.name === "favs") renderFavs();
});
$$("[data-cur]").forEach(x => x.setAttribute("aria-pressed", x.dataset.cur === CUR));

/* ================= boot ================= */
applyTheme();
updateFavBadge();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => movePill($("[data-nav][aria-current]")));
route = parseHash();
render();
loadFx().then(() => { $("#fxInfo").textContent = fxLine(); });
$("#fxInfo").textContent = fxLine();
</script>
</body>
</html>
